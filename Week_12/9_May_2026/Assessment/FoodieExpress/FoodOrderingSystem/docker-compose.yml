services:

  # ─── SQL Server ─────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: food_sqlserver
    environment:
      SA_PASSWORD: "FoodOrder@123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - foodnet
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P FoodOrder@123 -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Web (MVC) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: src/FoodOrderingSystem.Web/Dockerfile
    container_name: food_web
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;Database=FoodOrderingDb;
        User Id=SA;Password=FoodOrder@123;
        TrustServerCertificate=True;MultipleActiveResultSets=true
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - foodnet
    volumes:
      - food_images:/app/wwwroot/images/food

  # ─── API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/FoodOrderingSystem.API/Dockerfile
    container_name: food_api
    ports:
      - "5001:8081"
    environment:
      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;Database=FoodOrderingDb;
        User Id=SA;Password=FoodOrder@123;
        TrustServerCertificate=True;MultipleActiveResultSets=true
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - foodnet

volumes:
  sqldata:
  food_images:

networks:
  foodnet:
    driver: bridge
