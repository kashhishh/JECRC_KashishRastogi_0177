<div class="page">
  <div class="page-header">
    <h2>Your Cart</h2>
    <a routerLink="/" class="back-btn">← Continue Shopping</a>
  </div>

  <div class="empty-cart" *ngIf="getItems().length === 0">
    <div class="empty-icon">🛒</div>
    <p>Your cart is empty.</p>
    <a routerLink="/" class="shop-btn">Browse Products</a>
  </div>

  <div *ngIf="getItems().length > 0">
    <div class="cart-list">
      <div class="cart-item" *ngFor="let item of getItems()">
        <div class="item-info">
          <h3>{{ item.name }}</h3>
          <p class="item-price">${{ item.price }} each</p>
        </div>
        <div class="item-controls">
          <button class="qty-btn" (click)="decrease(item.id)">−</button>
          <span class="qty">{{ item.quantity }}</span>
          <button class="qty-btn" (click)="increase(item.id)">+</button>
        </div>
        <div class="item-total">${{ item.price * item.quantity }}</div>
        <button class="remove-btn" (click)="remove(item.id)">✕</button>
      </div>
    </div>

    <div class="cart-summary">
      <div class="summary-row">
        <span>Items ({{ cartService.getTotalCount() }})</span>
        <span>${{ getTotal() }}</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>${{ getTotal() }}</span>
      </div>
      <div class="summary-actions">
        <button class="clear-btn" (click)="clearCart()">Clear Cart</button>
        <button class="checkout-btn">Checkout</button>
      </div>
    </div>
  </div>
</div>
