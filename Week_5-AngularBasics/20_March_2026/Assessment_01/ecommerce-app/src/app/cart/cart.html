<div *ngFor="let item of cart.cartItems()">
  {{item.name}} - ₹{{item.price}}

  <button (click)="cart.updateQty(item.id, item.quantity + 1)">+</button>
  <button (click)="cart.updateQty(item.id, item.quantity - 1)">-</button>

  <button (click)="cart.removeItem(item.id)">Remove</button>
</div>

<h3>Total: ₹{{cart.getTotal()}}</h3>
<button (click)="cart.clearCart()">Clear Cart</button>
