<h2>My Pizza App</h2>
<label>Pizza Name:</label>
<input type ="text" [(ngModel)]="pizzaName">
<br><br>

<label>Quantity:</label>
<input type ="text" [(ngModel)]="quantity">
<br><br>

<label>Delivery Address:</label>
<textarea [(ngModel)]="address"> </textarea>

<br>
<h3>Order Summary</h3>
<p>Pizza:{{pizzaName}}</p>
<p>Quantity: {{quantity}}</p>
<p>Address: {{address}}</p>
